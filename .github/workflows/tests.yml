name: Tests

on:
  push:
  pull_request:

jobs:
  skills:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Product client tests
        run: python -m unittest discover -s query-carair-products/tests -v
      - name: Research workflow tests
        run: python -m unittest discover -s carair-new-sku-research/tests -v
